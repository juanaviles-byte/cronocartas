# Arma el APK de Android con Capacitor cada vez que cambia la app, y lo publica como «release».
# Descarga directa del último: https://github.com/juanaviles-byte/cronocartas/releases/latest/download/cronocartas.apk
name: APK de Android

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
      - 'img/**'
      - 'audio/**'
      - 'apk/**'
      - 'capacitor.config.json'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Copiar la app a www/
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js css js data icons img audio www/

      - name: Instalar Capacitor 8
        run: npm install --no-save --no-package-lock @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Íconos, pantalla de carga y número de versión
        run: |
          cp -r apk/res/. android/app/src/main/res/
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android

      # Copiarla a ~/.android no bastaba: Gradle creaba una llave nueva en cada armado y Android
      # rechazaba la actualización («conflicto con un paquete»). Se declara la llave en el proyecto.
      - name: Firmar siempre con la misma llave (para actualizar sin desinstalar)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fija {
                      storeFile file("${rootDir}/../apk/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fija }
              }
          }
          GRADLE

      - name: Armar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Comprobar que la firma es la de siempre
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee firma.txt
          grep -qi "SHA-256 digest: 66dc7accaee90f7274e29d916bcd47095ceb8fb6c3fd924b7ab7a2f655dff0c0" firma.txt

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cronocartas.apk
          ls -lh cronocartas.apk
          gh release create "apk-${{ github.run_number }}" cronocartas.apk \
            --title "Cronocartas 1.${{ github.run_number }}" \
            --notes "APK para tablets Android. Para instalar: copiar el archivo a la tablet, abrirlo y permitir la instalación." \
            --latest
